r(--score) 100;stroke-dashoffset:0;filter:drop-shadow(0 0 5px var(--accent))}.gauge-value.rainbow{stroke:url(#rainbow-gradient)}.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:5px}.score{font-size:clamp(36px,4vw,57px);font-weight:700;line-height:1;letter-spacing:-.04em}.score-denom{font-size:clamp(14px,1.55vw,21px);color:#b8c8d2;margin-top:3px}.score-label{text-align:center;color:var(--accent);font-weight:700;font-size:clamp(12px,1.15vw,16px);margin-top:-8px}.vital-list{padding:0 3px 0 9px}.vital{display:grid;grid-template-columns:30px auto 1fr;align-items:center;gap:6px;margin:14px 0}.vital-icon{font-size:23px;color:#19ccf1;text-align:center}.vital.rr .vital-icon{color:#46ef87}.vital-name{font-size:clamp(12px,1.15vw,16px);color:#a7cbd7;white-space:nowrap}.vital.rr .vital-name{color:#a9e8b8}.vital-value{font-size:clamp(20px,2.1vw,31px);font-weight:650;text-align:right;white-space:nowrap}.vital-unit{font-size:clamp(9px,.95vw,13px);font-weight:400;margin-left:4px}.chart-top{display:flex;justify-content:flex-end;gap:14px;font-size:clamp(9px,.85vw,12px);margin:0 3px 1px;color:#d9e2e9}.key{display:flex;align-items:center;gap:5px}.key i{display:block;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 7px currentColor}.key.resp i{background:#42ef81}.chart{height:clamp(54px,6vw,78px);width:100%;border-bottom:1px solid #b7cbd2;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(33.33% - 1px),#20405099 33.33%);position:relative}.chart svg{height:100%;width:100%;overflow:visible}.axis{position:absolute;left:0;right:0;bottom:-21px;display:flex;justify-content:space-between;font-size:clamp(8px,.9vw,12px);color:#e1e7ed}.charts-area{padding:0 10px 14px}.seat.off .gauge-value{stroke:#66717b;filter:none}.seat.off .vital-icon,.seat.off .vital-name,.seat.off .chart-top{color:#77828e}.seat.off .key i{background:#818a94}.seat.off .chart{border-color:#74808a}.footer-note{display:flex;justify-content:space-between;color:#526877;font-size:10px;padding:14px 3px 0}@media(max-width:850px){.screen{padding:10px}.hero{grid-template-columns:27% 1fr 10%;padding:10px 3%;height:90px}.hero-brand strong{letter-spacing:.2em}.hero-brand span{letter-spacing:.2em}.hero-ad{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.seat{min-height:290px;padding:12px}.body{grid-template-columns:45% 55%}.vital{grid-template-columns:22px auto 1fr;gap:4px}.vital-icon{font-size:19px}.vital-name{font-size:11px}.vital-value{font-size:20px}.vital-unit{font-size:9px}.gauge-wrap{width:100%}}@media(max-width:540px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:34% 1fr;height:84px}.hero-brand{text-align:right}.seat{min-height:290px}.body{grid-template-columns:44% 56%;max-width:470px;margin:auto}.gauge-wrap{max-width:165px}.vital{margin:12px 0}.chart{height:68px}.footer-note{font-size:9px}}
</style><style>.lung-icon{width:23px;height:23px;display:block;margin:0 auto;fill:currentColor}</style></head><body><svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs><linearGradient id="rainbow-gradient" x1="0%" y1="50%" x2="100%" y2="50%"><stop offset="0%" stop-color="#ff3434"/><stop offset="17%" stop-color="#ff9c2b"/><stop offset="34%" stop-color="#ffe544"/><stop offset="51%" stop-color="#36e878"/><stop offset="68%" stop-color="#21d8e8"/><stop offset="84%" stop-color="#4485ff"/><stop offset="100%" stop-color="#bd57e8"/></linearGradient></defs></svg><main class="screen">
<header class="hero"><div class="datetime"><div class="date" id="date">2026/11/13</div><div class="time" id="time">10:17</div></div><div class="hero-brand"><strong>SAUNA × WELLNESS</strong><span>for a better tomorrow</span></div><div class="hero-ad">WELLNESS PARTNER</div></header>
<section id="grid" class="grid" aria-label="6席のサウナバイタルモニター"></section><footer class="footer-note"><span>ととのい度・心拍数・呼吸数はモニター表示用の参考値です</span><span>VITAL DISPLAY · DEMO DATA</span></footer>
</main><script>
const seats=[
{id:1,state:'active',score:77,hr:72,rr:14,badge:'👑 ととのい王',seed:1},
{id:2,state:'ready',score:0,hr:0,rr:0,badge:'🍃 測定可能',seed:2},
{id:3,state:'active',score:96,hr:69,rr:13,badge:'💎 極み',seed:3},
{id:4,state:'low',score:54,hr:89,rr:19,badge:'♨ 高ととのい',seed:4},
{id:5,state:'active',score:85,hr:71,rr:15,badge:'★ ととのい中',seed:5},
{id:6,state:'ready',score:0,hr:0,rr:0,badge:'🍃 測定可能',seed:6}
];
function values(base,seed,amp){return Array.from({length:12},(_,i)=>base+Math.sin(i*.9+seed)*amp+Math.cos(i*.48+seed*.8)*amp*.38)}
function points(vals){let mn=Math.min(...vals)-3,mx=Math.max(...vals)+3;return vals.map((v,i)=>`${i?'L':'M'}${(i*100/(vals.length-1)).toFixed(1)},${(92-(v-mn)/(mx-mn)*72).toFixed(1)}`).join(' ')}
function graph(s){if(s.state==='off'||s.state==='ready')return '';let hr=values(s.hr,s.seed,5),rr=values(s.rr,s.seed+.8,1.7);return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="心拍数と呼吸数の75秒推移"><path d="${points(hr)}" fill="none" stroke="#12c9ef" stroke-width="2.1" vector-effect="non-scaling-stroke"/><path d="${points(rr)}" fill="none" stroke="#42ef81" stroke-width="2.1" vector-effect="non-scaling-stroke"/>${hr.map((v,i)=>`<circle cx="${(i*100/11).toFixed(1)}" cy="${points(hr).split(' ')[i].slice(1).split(',')[1]}" r="1.6" fill="#12c9ef" vector-effect="non-scaling-stroke"/>`).join('')}${rr.map((v,i)=>`<circle cx="${(i*100/11).toFixed(1)}" cy="${points(rr).split(' ')[i].slice(1).split(',')[1]}" r="1.6" fill="#42ef81" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`}
function card(s){let off=s.state==='off',ready=s.state==='ready';let title=off||ready?{icon:'🍃',name:'測定可能'}:s.score>=95?{icon:'🌈',name:'ととのい神'}:s.score>=80?{icon:'🔥',name:'高ととのい'}:s.score>=70?{icon:'✦',name:'ととのい中'}:{icon:'🍃',name:'リラックス'};let score=ready?0:off?'—':s.score;let valHr=off?'--':s.hr,valRr=off?'--':s.rr;let cls=off?"off":ready?"blue":s.score>=95?"rainbow":s.score>=80?"red":s.score>=70?"green":"blue";let meter=ready?0:off?0:s.score;return `<article class="seat ${cls} ${off||ready?'unseated':'seated'}"><div class="head"><div class="seat-id">SEAT ${String(s.id).padStart(2,'0')}</div><div class="badge"><span class="emoji">${title.icon}</span>${title.name}</div></div><div class="body"><div><div class="gauge-wrap"><svg class="gauge" viewBox="0 0 100 100" aria-hidden="true"><circle class="gauge-bg" cx="50" cy="50" r="42" pathLength="100"/><circle class="gauge-value ${meter>=95?'rainbow':''}" cx="50" cy="50" r="42" pathLength="100" style="--score:${meter}"/></svg><div class="gauge-center"><div class="score">${score}</div><div class="score-denom">/100</div></div></div><div class="score-label">ととのい度</div></div><div class="vital-list"><div class="vital"><span class="vital-icon">♥</span><span class="vital-name">心拍数</span><span class="vital-value">${valHr}<span class="vital-unit">bpm</span></span></div><div class="vital rr"><span class="vital-icon"><svg class="lung-icon" viewBox="0 0 36 40" aria-hidden="true"><path d="M16 4h4v11c0 1.5.8 2.9 2.2 4.2l3.2 3-2.8 3.2-4.6-4-4.6 4-2.8-3.2 3.2-3c1.4-1.3 2.2-2.7 2.2-4.2V4Z"/><path d="M16.4 15.2c-3.1-3.6-7.2-4.6-10.2-1.8C2.1 17.1.9 25.5 1.9 31.2c.8 4.1 3.8 5.7 7 3.7 4.5-2.7 7.2-6.9 7.5-11.2v-8.5Z"/><path d="M19.6 15.2c3.1-3.6 7.2-4.6 10.2-1.8 4.1 3.7 5.3 12.1 4.3 17.8-.8 4.1-3.8 5.7-7 3.7-4.5-2.7-7.2-6.9-7.5-11.2v-8.5Z"/><path d="m17.9 18.1-5.1 4.4-1.7 4.8m6.8-8.4 4.2 3.7 1.5 4.7" fill="none" stroke="#07121a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="vital-name">呼吸数</span><span class="vital-value">${valRr}<span class="vital-unit">/min</span></span></div></div></div><div class="charts-area"><div class="chart-top"><span class="key"><i></i>心拍数</span><span class="key resp"><i></i>呼吸数</span></div><div class="chart">${graph(s)}<div class="axis"><span>-75s</span><span>-60s</span><span>-45s</span><span>-30s</span><span>-15s</span><span>Now</span></div></div></div></article>`}
function tick(){const n=new Date();document.getElementById('date').textContent=`${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')}`;document.getElementById('time').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;document.getElementById('grid').innerHTML=seats.map(card).join('')}
tick();setInterval(tick,5000);
</script></body></html>
